{% extends "base.html" %}
{% block titulo %}Crear cuenta · Butaca{% endblock %}
{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm p-4">
                <h1 class="h3 mb-3">Crear cuenta</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "_formulario.html" %}
                    <button type="submit" class="btn btn-acento w-100">Registrarme</button>
                </form>
                <p class="mt-3 mb-0 text-center">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
            </div>
        </div>
    </div>
{% endblock %}
