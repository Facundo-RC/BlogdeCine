{% extends "base.html" %}
{% block titulo %}Editar perfil · Butaca{% endblock %}
{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm p-4">
                <h1 class="h3 mb-3">Editar perfil</h1>
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {% include "_formulario.html" %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-acento">Guardar cambios</button>
                        <a href="{% url 'perfil' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
