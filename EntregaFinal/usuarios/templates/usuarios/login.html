{% extends "base.html" %}
{% block titulo %}Iniciar sesión · Butaca{% endblock %}
{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm p-4">
                <h1 class="h3 mb-3">Iniciar sesión</h1>
                {% if next %}
                    <div class="alert alert-info">Tenés que iniciar sesión para ver esa página.</div>
                {% endif %}
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "_formulario.html" %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-acento w-100">Ingresar</button>
                </form>
                <p class="mt-3 mb-0 text-center">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
            </div>
        </div>
    </div>
{% endblock %}
