<div class="col">
    <article class="card h-100 shadow-sm tarjeta-post">
        {% if post.imagen %}
            <img src="{{ post.imagen.url }}" class="card-img-top" alt="Imagen de {{ post.titulo }}">
        {% else %}
            <div class="sin-imagen d-flex align-items-center justify-content-center card-img-top">
                <span class="fs-1 fw-bold">{{ post.titulo|first|upper }}</span>
            </div>
        {% endif %}
        <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">{{ post.titulo }}</h2>
            {% include "posts/_datos_pelicula.html" with clase_extra="small mb-2" %}
            <p class="text-muted small mb-2">Por {{ post.autor.username }} · {{ post.fecha_creacion|date:"d/m/Y" }}</p>
            <p class="card-text">{{ post.contenido|truncatewords:25 }}</p>
            <a href="{{ post.get_absolute_url }}" class="btn btn-acento mt-auto align-self-start">Leer más</a>
        </div>
    </article>
</div>
